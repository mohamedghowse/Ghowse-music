🎧 Ghowse Music Logo

<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghowse Music</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* பிரீமியம் பிளாக் & கோல்ட் ஸ்டைல் */
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --gold: #d4af37;
            --gold-hover: #f3e5ab;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* ஹெடர் & லோகோ */
        header {
            background-color: #000000;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 2px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* மெயின் கன்டெய்னர் */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* மியூசிக் பிளேயர் பகுதி */
        .main-player {
            background: linear-gradient(145deg, #1a1a1a, #111111);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin-bottom: 40px;
        }

        /* ஆல்பம் கவர் அனிமேஷன் */
        .album-art-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 20px;
        }

        .album-art {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--gold);
            object-fit: cover;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            animation: rotateArt 20s linear infinite;
            animation-play-state: paused;
        }

        @keyframes rotateArt {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .song-details h2 {
            font-size: 24px;
            color: var(--gold);
            margin-bottom: 5px;
        }

        .song-details p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* ஆடியோ பிளேயர் கஸ்டமைசேஷன் */
        audio {
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            outline: none;
        }

        audio::-webkit-media-controls-panel {
            background-color: var(--gold);
        }

        /* டவுன்லோட் பட்டன் */
        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--gold);
            color: #000;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-download:hover {
            background-color: var(--gold-hover);
            transform: translateY(-2px);
        }

        /* யூடியூப் வீடியோ பகுதி */
        .video-section {
            margin-bottom: 40px;
            text-align: center;
        }

        .section-title {
            color: var(--gold);
            font-size: 22px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* காண்டாக்ட் ஃபார்ம் */
        .contact-section {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .contact-form input, .contact-form textarea {
            background-color: #0d0d0d;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

        .contact-form input:focus, .contact-form textarea:focus {
            border-color: var(--gold);
        }

        .btn-submit {
            background-color: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--gold);
            color: #000;
        }

        /* ஃபூட்டர் */
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 40px;
            border-top: 1px solid #222;
        }

        /* மொபைல் போன்களுக்கான பிரத்யேக வடிவமைப்பு (Responsive) */
        @media (max-width: 600px) {
            .container { padding: 15px; }
            .main-player { padding: 20px; }
            .album-art-container { width: 170px; height: 170px; }
            .logo { font-size: 22px; }
            .section-title { font-size: 18px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fas fa-headphones-alt"></i> GHOWSE MUSIC
        </div>
    </header>

    <div class="container">
        
        <section class="main-player">
            <div class="album-art-container">
                <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=400&auto=format&fit=crop" alt="Album Cover" class="album-art" id="album-art">
            </div>
            
            <div class="song-details">
                <h2 id="title">Trending Premium Beat</h2>
                <p id="artist">Produced by Ghowse</p>
            </div>

            <audio id="audio-track" controls>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

            <br>
            <a href="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" download="Ghowse_Music_Track.mp3" class="btn-download">
                <i class="fas fa-download"></i> Download Track
            </a>
        </section>

        <section class="video-section">
            <h3 class="section-title"><i class="fab fa-youtube"></i> Featured Video</h3>
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </section>

        <section class="contact-section">
            <h3 class="section-title" style="text-align: center;"><i class="fas fa-envelope"></i> Contact Ghowse</h3>
            <form class="contact-form" action="https://formspree.io/f/your_form_id" method="POST"> 
                <input type="text" name="name" placeholder="உங்கள் பெயர்" required>
                <input type="email" name="email" placeholder="உங்கள் மின்னஞ்சல் (Email)" required>
                <textarea name="message" rows="4" placeholder="உங்கள் கருத்து அல்லது விபரம்..." required></textarea>
                <button type="submit" class="btn-submit">அனுப்புக (Send Message)</button>
            </form>
        </section>

    </div>

    <footer>
        <p>&copy; 2026 Ghowse Music. All Rights Reserved. Designed for Mobile & PC.</p>
    </footer>

    <script>
        const audioTrack = document.getElementById('audio-track');
        const albumArt = document.getElementById('album-art');

        // பாடல் இயங்கும்போது படம் சுழலும், நிறுத்தும்போது நிற்கும்
        audioTrack.onplay = function() {
            albumArt.style.animationPlayState = 'running';
        };
        audioTrack.onpause = function() {
            albumArt.style.animationPlayState = 'paused';
        };
    </script>
</body>
                    </html>
