<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>எனது மியூசிக் இணையதளம்</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .player-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 350px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .album-art {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: rotate 20s linear infinite;
            animation-play-state: paused;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h2 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        p {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 20px;
        }

        audio {
            width: 100%;
            margin-top: 10px;
            outline: none;
        }

        /* ஆடியோ பிளேயரின் நிறத்தை மாற்ற (Chrome/Safari) */
        audio::-webkit-media-controls-panel {
            background-color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="album-art" id="art">🎵</div>

        <h2 id="song-title">பாடலின் தலைப்பு</h2>
        <p id="artist-name">இசையமைப்பாளர் / பாடகர்</p>

        <audio id="audio-player" controls>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            உங்கள் பிரவுசர் இந்த ஆடியோவை ஆதரிக்கவில்லை.
        </audio>
    </div>

    <script>
        const audio = document.getElementById('audio-player');
        const art = document.getElementById('art');

        // பாடல் இயங்கும்போது படம் சுழலும், நிறுத்தும்போது நிற்கும்
        audio.onplay = function() {
            art.style.animationPlayState = 'running';
        };
        audio.onpause = function() {
            art.style.animationPlayState = 'paused';
        };
    </script>

</body>
</html>
